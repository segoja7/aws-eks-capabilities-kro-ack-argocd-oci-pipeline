apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Platform layers rendered from KCL (KRO RGDs + ACK/KRO claims)
  sourceNamespaces:
    - argocd
  sourceRepos:
    - oci://${MANIFESTS_REPO}
  destinations:
    - name: in-cluster
      namespace: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
